name: Deploy Status Page

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create status page
        run: |
          mkdir site

          cat > site/index.html <<EOF
          <html>
          <body>
          <h1>customer-api-8</h1>
          <p>Status: Running</p>
          <p>Provisioned from Port.io</p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
