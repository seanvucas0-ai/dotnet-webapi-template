name: Deploy Service Status

on:
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create service page
        run: |
          mkdir site

          cat > site/index.html << EOF
          <html>
          <head>
              <title>Service Running</title>
          </head>
          <body>
              <h1>Service Running</h1>
              <p>Repository: ${{ github.repository }}</p>
              <p>Status: Running</p>
              <p>Provisioned from Port</p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
