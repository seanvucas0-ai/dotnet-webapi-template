name: Create Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: Service name
        required: true
        type: string

      description:
        description: Service description
        required: true
        type: string

      team_name:
        description: Owning team
        required: true
        type: string

jobs:
  create_repo:
    runs-on: ubuntu-latest

    steps:

      - name: Debug Inputs
        run: |
          echo "service_name='${{ github.event.inputs.service_name }}'"
          echo "description='${{ github.event.inputs.description }}'"
          echo "team_name='${{ github.event.inputs.team_name }}'"

      - name: Validate Inputs
        run: |
          if [ -z "${{ github.event.inputs.service_name }}" ]; then
            echo "service_name is empty"
            exit 1
          fi

          if [ -z "${{ github.event.inputs.description }}" ]; then
            echo "description is empty"
            exit 1
          fi

          if [ -z "${{ github.event.inputs.team_name }}" ]; then
            echo "team_name is empty"
            exit 1
          fi

      - name: Create repository from template
        id: create_repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |

            const serviceName = '${{ github.event.inputs.service_name }}';
            const description = '${{ github.event.inputs.description }}';

            console.log(`Service Name: ${serviceName}`);
            console.log(`Description: ${description}`);

            try {
              await github.rest.repos.get({
                owner: 'seanvucas0-ai',
                repo: serviceName
              });

              throw new Error(`Repository '${serviceName}' already exists`);
            } catch (err) {

              if (err.status !== 404) {
                throw err;
              }

              console.log("Repository does not exist. Creating...");
            }

            const repo = await github.rest.repos.createUsingTemplate({
              template_owner: 'seanvucas0-ai',
              template_repo: 'dotnet-webapi-template',
              owner: 'seanvucas0-ai',
              name: serviceName,
              description: description,
              private: true
            });

            core.setOutput("repo_name", repo.data.name);

      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          repository: seanvucas0-ai/${{ steps.create_repo.outputs.repo_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Update README
        run: |
          cat << EOF > README.md
          # ${{ github.event.inputs.service_name }}

          ## Description

          ${{ github.event.inputs.description }}

          ## Team

          Owned by ${{ github.event.inputs.team_name }}

          ## Status

          Provisioning
          EOF

      - name: Replace appsettings values
        run: |
          sed -i "s/{{SERVICE_NAME}}/${{ github.event.inputs.service_name }}/g" appsettings.json
          sed -i "s/{{TEAM_NAME}}/${{ github.event.inputs.team_name }}/g" appsettings.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md appsettings.json

          git commit -m "Populate template values" || true

          git push

      - name: Create Port Entity
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |

          echo "Requesting Port access token..."

          RESPONSE=$(curl -s \
            --location \
            --request POST \
            "https://api.port.io/v1/auth/access_token" \
            --header "Content-Type: application/json" \
            --data-raw "{
              \"clientId\":\"$PORT_CLIENT_ID\",
              \"clientSecret\":\"$PORT_CLIENT_SECRET\"
            }")

          echo "Port response received"

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to obtain Port access token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Port authentication successful"

          curl --fail \
            --location \
            --request POST \
            "https://api.port.io/v1/blueprints/service_1/entities?upsert=true" \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-raw "{
              \"identifier\":\"${{ github.event.inputs.service_name }}\",
              \"title\":\"${{ github.event.inputs.service_name }}\",
              \"properties\":{
                \"service_name\":\"${{ github.event.inputs.service_name }}\",
                \"description\":\"${{ github.event.inputs.description }}\",
                \"team_name\":\"${{ github.event.inputs.team_name }}\",
                \"deployment_status\":\"Provisioning\"
              },
              \"relations\":{}
            }"

          echo "Port entity created successfully"
