name: Create Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        required: true
        type: string

      description:
        required: true
        type: string

      team_name:
        required: true
        type: string

jobs:
  create_repo:
    runs-on: ubuntu-latest

    steps:
      - name: Create repository from template
        uses: actions/github-script@v7
        id: create_repo
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const repo = await github.rest.repos.createUsingTemplate({
              template_owner: 'seanvucas0-ai',
              template_repo: 'dotnet-webapi-template',
              owner: 'seanvucas0-ai',
              name: '${{ github.event.inputs.service_name }}',
              description: '${{ github.event.inputs.description }}',
              private: true
            });

            core.setOutput("repo_name", repo.data.name);

      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          repository: seanvucas0-ai/${{ steps.create_repo.outputs.repo_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Update README
        run: |
          cat << EOF > README.md
          # ${{ github.event.inputs.service_name }}

          ## Description

          ${{ github.event.inputs.description }}

          ## Team

          Owned by ${{ github.event.inputs.team_name }}
          
          EOF
          
          - name: Replace appsettings values
          run: |
          sed -i "s/{{SERVICE_NAME}}/${{ github.event.inputs.service_name }}/g" appsettings.json
      
          sed -i "s/{{TEAM_NAME}}/${{ github.event.inputs.team_name }}/g" appsettings.json
      
            - name: Commit changes
              run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md
          git commit -m "Populate template values" || exit 0
          git push
          - name: Register Entity in Port
            run: |
              curl -X POST https://api.getport.io/v1/blueprints/service/entities
