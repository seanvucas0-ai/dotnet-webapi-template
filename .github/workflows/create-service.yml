name: Create Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        required: true
        type: string

      description:
        required: true
        type: string

      team_name:
        required: true
        type: string

jobs:
  create_repo:
    runs-on: ubuntu-latest

    steps:
      - name: Create repository from template
        id: create_repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const repo = await github.rest.repos.createUsingTemplate({
              template_owner: 'seanvucas0-ai',
              template_repo: 'dotnet-webapi-template',
              owner: 'seanvucas0-ai',
              name: '${{ github.event.inputs.service_name }}',
              description: '${{ github.event.inputs.description }}',
              private: true
            });

            core.setOutput("repo_name", repo.data.name);

      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          repository: seanvucas0-ai/${{ steps.create_repo.outputs.repo_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Update README
        run: |
          cat << EOF > README.md
          # ${{ github.event.inputs.service_name }}

          ## Description

          ${{ github.event.inputs.description }}

          ## Team

          Owned by ${{ github.event.inputs.team_name }}

          ## Status

          Provisioning
          EOF

      - name: Replace appsettings values
        run: |
          sed -i "s/{{SERVICE_NAME}}/${{ github.event.inputs.service_name }}/g" appsettings.json
          sed -i "s/{{TEAM_NAME}}/${{ github.event.inputs.team_name }}/g" appsettings.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md appsettings.json

          git commit -m "Populate template values" || exit 0

          git push

      - name: Create Port Entity
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |

          echo "Requesting Port access token..."

          ACCESS_TOKEN=$(curl -s \
            --location \
            --request POST \
            "https://api.port.io/v1/auth/access_token" \
            --header "Content-Type: application/json" \
            --data-raw "{
              \"clientId\": \"$PORT_CLIENT_ID\",
              \"clientSecret\": \"$PORT_CLIENT_SECRET\"
            }" | jq -r '.accessToken')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to obtain Port access token"
            exit 1
          fi

          echo "Port authentication successful"

          curl --fail --location \
            --request POST \
            "https://api.port.io/v1/blueprints/service_1/entities?upsert=true" \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-raw "{
              \"identifier\": \"${{ github.event.inputs.service_name }}\",
              \"title\": \"${{ github.event.inputs.service_name }}\",
              \"properties\": {
                \"service_name\": \"${{ github.event.inputs.service_name }}\",
                \"description\": \"${{ github.event.inputs.description }}\",
                \"team_name\": \"${{ github.event.inputs.team_name }}\",
                \"deployment_status\": \"Provisioning\"
              },
              \"relations\": {}
            }"

          echo "Port entity created successfully"
